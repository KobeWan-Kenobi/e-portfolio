<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kobe Halog</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://kit.fontawesome.com/020fad7f3d.js" crossorigin="anonymous"></script>
</head>

<body>
  <section id="about-me">
    <nav>
      <div class="personal__logo">Kobe Halog</div>
      <ul class="nav__link--list">
        <li>
          <a href="" class="nav__link--anchor link__hover-effect link__hover-effect--black">Languages</a>
        </li>
        <li>
          <a href="" class="nav__link--anchor link__hover-effect link__hover-effect--black">Project</a>
        </li>
        <li>
          <a href="" class="nav__link--anchor nav__link--anchor-primary">Contact</a>
        </li>
      </ul>
    </nav>
    <div class="flex-1 flex">
      <div class="about-me__info row">
        <div class="about-me__info--container">
          <figure class="about-me__picture--mask">
            <img src="./assets/Kobe_Halog-cropped-2.JPG" class="about-me__picture" alt="Kpbe's Profile Picture">
          </figure>
          <h1 class="about-me__info--title">
            Hey! I'm <span class="text--purple">Kobe Halog</span> 👋🏽
          </h1>
          <p class="about-me__info--paragraph">I'm an <strong class="text--purple">aspiring full stack engineer</strong>
            with a strong passion for building responsive and high-quality web applications with easy-to-use user
            interfaces.</p>
          <!-- it should be fa-brands below instead of fab -->
          <div class="about-me__links">
            <a href="" class="about-me__link">
              <i class="fa-brands fa-square-linkedin"></i>
            </a>
            <a href="" class="about-me__link">
              <i class="fa-brands fa-square-github"></i>
            </a>
            <a href="" class="about-me__link">
              <i class="fa-solid fa-envelope"></i>
            </a>
            <a href="" class="about-me__link">
              <i class="fa-solid fa-file-pdf"></i>
            </a>
          </div>
          <figure class="about-me__img--container">
            <img src="./assets/undraw_websites.svg" alt="">
          </figure>
        </div>
      </div>

    </div>
  </section>
</body>

</html>
